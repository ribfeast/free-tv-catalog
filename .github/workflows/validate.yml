# Checks every change to catalog.json BEFORE it can reach the app, and
# confirms AFTER a merge that the app is actually being given it.
#
# Merging to main here is a release: every phone re-reads catalog.json within
# minutes, and a broken file is read as "no channels" (that happened once, from
# an invisible marker PowerShell put at the start of the file). This workflow
# runs tools/validate_catalog.dart on every pull request and on every push to
# main, and GitHub greys out the Merge button until it has passed (the branch
# rule on main requires the "validate" check - see README.md, "Turn on the
# merge lock").
#
# On a pull request it also TEST-PLAYS every stream address the change adds
# (the ones not already in main's catalog.json) with check-streams.sh - the
# same script the weekly sweep uses - so a mistyped address is refused before
# it ships as a spinner, instead of being found up to a week later.
#
# After a merge, the separate "published" job waits until the live address
# serves the merged "version". That is what "published" means (the app repo's
# CLAUDE.md, Testing rules): the live address was fetched and served it.
#
# The pull-request run repeats when the description is EDITED (see the
# trigger below). Nothing runs on a push to any other branch: the pull
# request already covers it, and a push-only run has no pull-request
# description to read, so the "drop intended" rule would go red with no way
# to clear it.
#
# The job is called "validate" on purpose: that is the name picked in the
# branch-protection settings. Rename it and the lock silently stops applying.
# Everything that must gate a merge therefore lives in that one job.
#
# Safety notes for anyone editing this file:
#  * The workflow can only READ the repository (permissions below). It needs
#    nothing more, and a token that could write would be worth stealing.
#  * It runs on `pull_request`, never `pull_request_target`. The latter runs
#    with write access on code from a stranger's fork, which is how public
#    repos get their tokens taken.
#  * Third-party actions are pinned to a commit SHA, not a tag - the
#    repository refuses anything else. A tag can be moved to point at
#    different code; a SHA cannot. .github/dependabot.yml proposes updates
#    once a month.
#  * The pull-request description is read through an environment variable,
#    never pasted into the script, so text in it cannot run as commands.

name: validate

on:
  pull_request:
    # `edited` is not one of GitHub's defaults (those are opened, synchronize
    # and reopened). Without it, writing "drop intended" in the description
    # AFTER seeing the red check does nothing until another commit is pushed,
    # which is exactly the moment the README tells the owner to write it.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Most runs take a minute or two. The long tail is test-playing a new
    # channel from a slow host: one host measured on 2026-09-19 took 12-20 s
    # just to open each connection, and a channel can have 150 files.
    timeout-minutes: 45
    steps:
      - name: Check out the repository (with history, to find the base file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      # The "base" is the catalog.json that is LIVE NOW, which the checker
      # compares against to insist "version" went up, to spot channels or items
      # vanishing, and to shout when a change moves what is on air. Which
      # commit that is depends on what triggered the run:
      #  * a pull request: the branch it will merge into. NOT the commit
      #    before, which is what a first draft of this file used - a
      #    two-commit pull request whose version was raised once, the normal
      #    way to work, went red on its second commit because that commit
      #    changed the file without raising the version again. What matters
      #    is always the distance from what phones are reading today;
      #  * a push to main (a merge, i.e. a release): the commit before it.
      # When there is no base (a brand-new repository) the comparison is
      # skipped and the checker says so in its report.
      #
      # Removing a channel, a big share of one channel's items, or raising a
      # channel's "requires" (which hides it from older app builds) is
      # refused unless the pull request says it is meant: the phrase to write
      # in its description is exactly "drop intended", and editing the
      # description re-runs this check. A push to main has no description to
      # read (the pull request that was just merged is not part of a push
      # event), so the push run passes --allow-drop and reports the drop as a
      # warning: the pull-request run was the gate, and a red cross on main
      # for a drop that was approved a minute earlier would only teach the
      # owner to ignore red crosses.
      - name: Fetch the version of catalog.json that is live now
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$PUSH_BEFORE"
          fi
          if git cat-file -e "$base:catalog.json" 2>/dev/null; then
            git show "$base:catalog.json" > /tmp/base_catalog.json
            echo "BASE_FILE=/tmp/base_catalog.json" >> "$GITHUB_ENV"
            echo "Comparing with catalog.json from $base"
          else
            echo "No base catalog.json at '$base' - the comparison is skipped."
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "VALIDATE_FLAGS=--allow-drop" >> "$GITHUB_ENV"
            echo "This is a push to main: any drop was gated by the pull request, so it is reported, not refused."
          elif printf '%s' "$PR_BODY" | grep -qi 'drop intended'; then
            echo "VALIDATE_FLAGS=--allow-drop" >> "$GITHUB_ENV"
            echo "The pull request says the drop is intended."
          fi

      # The report is written to a file and printed afterwards, on purpose, and
      # the step exits with the CHECKER's status. The obvious one-liner,
      # `dart ... | tee report`, is a trap: GitHub's default shell for `run`
      # is bash WITHOUT pipefail, so a pipeline's status is the last command's
      # - tee's, always 0 - and the step stayed green while the report said
      # FAIL. The merge lock would never have turned red.
      - name: Validate catalog.json
        run: |
          status=0
          dart tools/validate_catalog.dart catalog.json ${BASE_FILE:-} ${VALIDATE_FLAGS:-} \
            > /tmp/validate_report.txt 2>&1 || status=$?
          cat /tmp/validate_report.txt
          exit "$status"

      # A checker that has quietly stopped checking is worse than none, because
      # its green tick goes on being believed. So once the real file has been
      # accepted, the self-test damages copies of it - one per rule - and
      # insists each copy is refused for the right reason. It runs AFTER the
      # checker, not before: given a file that is not even JSON it used to die
      # with a stack trace and the checker never ran, so a deleted comma read
      # as "the checker is broken" instead of "your file is not valid JSON".
      - name: Prove the checker still refuses what it says it refuses
        run: dart tools/validate_catalog_selftest.dart catalog.json

      # The same idea for the two network checks: a small web server on the
      # runner itself (127.0.0.1) plays a working video, a missing one, one
      # that never answers, a live stream with a dead picture, a lagging live
      # file and more, and each check must say the right thing about each.
      # It runs BEFORE the test-play, whose verdict means nothing if the
      # script behind it has stopped telling dead from alive.
      - name: Prove the stream check and the publish check still catch failures
        run: dart tools/network_checks_selftest.dart

      # Only the addresses this pull request ADDS - the rest were checked when
      # they were added, and the weekly sweep watches them. Generous on
      # purpose, because a false alarm teaches people to ignore the check:
      # 60 s per request, one retry 2 s later, 4 addresses at a time. Every
      # dead address is named with its host. It runs on every pull-request
      # run, including a description edit, so an edit can never turn a red
      # test-play green without the addresses being tried again.
      - name: Test-play the stream addresses this pull request adds
        if: github.event_name == 'pull_request'
        timeout-minutes: 35
        run: |
          status=0
          if [ -n "${BASE_FILE:-}" ]; then
            bash check-streams.sh --new-since "$BASE_FILE" \
              --timeout 60 --retries 1 --jobs 4 > /tmp/streams_report.txt 2>&1 || status=$?
          else
            echo "No base file, so every address counts as new." > /tmp/streams_report.txt
            bash check-streams.sh --timeout 60 --retries 1 --jobs 4 \
              >> /tmp/streams_report.txt 2>&1 || status=$?
          fi
          cat /tmp/streams_report.txt
          if [ "$status" -ne 0 ]; then
            echo
            echo "An address this change adds did not play (report above: DEAD lines name the file"
            echo "and its host). Fix the address in the channel's manifest, or, if the host was"
            echo "only slow today, re-run this job. Phones would have shown a spinner."
          fi
          exit "$status"

      # The report is also shown on the run's summary page, so the owner can
      # read "what changed" and any on-air warnings without opening the log.
      - name: Publish the report on the run's summary page
        if: always()
        run: |
          {
            echo '```'
            cat /tmp/validate_report.txt 2>/dev/null || echo "(the checker produced no report)"
            echo '```'
            if [ -f /tmp/streams_report.txt ]; then
              echo
              echo 'Test-play of the addresses this change adds:'
              echo
              echo '```'
              cat /tmp/streams_report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # After a merge: is the live address - the one every phone fetches - serving
  # the version that was just merged? GitHub's file server keeps a copy for up
  # to 5 minutes, so this asks every 20 s for up to 10 minutes, then goes red
  # with a plain message. A later merge that lands first counts as success
  # (its version is higher). It runs whether or not "validate" passed on main:
  # a file that reached phones is published either way, and that is the fact
  # this job reports. It never gates anything - the merge has happened.
  published:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Wait until the live address serves this version
        run: dart tools/live_version.dart --wait-for-file catalog.json --within 600 --every 20
